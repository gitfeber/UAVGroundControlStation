# Configures GitHub's auto-generated release notes (the notes appended by
# `generateReleaseNotes: true` in ci.yml and release.yml). Pull requests are
# grouped into the categories below by their labels.
changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Fixes
      labels:
        - bug
        - fix
    - title: 📚 Documentation
      labels:
        - documentation
    - title: 🧹 Maintenance
      labels:
        - chore
        - ci
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
