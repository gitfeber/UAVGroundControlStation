name: CI

# Main-branch pipeline: validates and then publishes a prerelease. Pull-request
# validation (without releasing) lives in branch-checks.yml.
on:
  push:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Default to read-only; the publish job opts up to contents: write where needed.
permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Cache TypeScript incremental build info
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            **/*.tsbuildinfo
            **/dist
          key: ${{ runner.os }}-ts-${{ hashFiles('**/tsconfig*.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ts-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm audit:js
      - run: pnpm build
      - run: pnpm build:cloud

  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf
      - run: cargo test
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit

  publish:
    needs: [node, rust]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 10.33.4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Cache TypeScript incremental build info
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            **/*.tsbuildinfo
            **/dist
          key: ${{ runner.os }}-ts-${{ hashFiles('**/tsconfig*.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ts-

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm exec tauri
          tagName: v__VERSION__-build.${{ github.run_number }}
          releaseName: UAV Ground Control Station v__VERSION__ Preview Build ${{ github.run_number }}
          generateReleaseNotes: true
          releaseBody: |
            ## Preview Build

            Automated preview build of the **UAV Ground Control Station** desktop app,
            published after CI passed on the source branch.

            | Detail | Value |
            |--------|-------|
            | Source branch | `${{ github.ref_name }}` |
            | Commit | `${{ github.sha }}` |
            | Run number | `${{ github.run_number }}` |

            ### Downloads

            | Platform | Artifact |
            |----------|----------|
            | Windows | `.msi` (WiX) and/or `.exe` (NSIS setup) |
            | Linux | `.deb`, `.AppImage`, and/or `.rpm` |

            > ⚠️ **This is an automated prerelease.** It is built from the latest
            > `main`/`master` commit and may be less stable than a tagged release.
            > Use it for testing and previewing changes, not for production flights.

            Stable, user-facing releases are created from semantic version tags such
            as `v0.2.1`. See the [release process](https://github.com/${{ github.repository }}#release-process)
            for details.
          releaseDraft: false
          prerelease: true
