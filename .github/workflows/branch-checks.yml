name: Branch Checks

# Validation-only pipeline for pull requests: typecheck, lint, tests, build,
# build:cloud (Hosted Web App), and cargo test — but NEVER a release. Use this
# to confirm a branch is green
# before merging to main. Releases live in ci.yml (main) and release.yml (tags).
on:
  pull_request:

# Cancel superseded runs when a PR branch is pushed again.
concurrency:
  group: branch-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least privilege: validation needs only to read the repo. No token write scope
# is granted, and forked-PR runs receive no secrets (pull_request, not _target).
permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Cache TypeScript incremental build info
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            **/*.tsbuildinfo
            **/dist
          key: ${{ runner.os }}-ts-${{ hashFiles('**/tsconfig*.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ts-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm audit:js
      - run: pnpm build
      - run: pnpm build:cloud

  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf
      - run: cargo test
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit
