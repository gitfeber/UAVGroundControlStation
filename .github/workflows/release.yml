name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Default to read-only; the publish job opts up to contents: write where needed.
permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Cache TypeScript incremental build info
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            **/*.tsbuildinfo
            **/dist
          key: ${{ runner.os }}-ts-${{ hashFiles('**/tsconfig*.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ts-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf
      - run: cargo test

  publish-tauri:
    needs: [node, rust]
    permissions:
      contents: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 10.33.4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Cache TypeScript incremental build info
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            **/*.tsbuildinfo
            **/dist
          key: ${{ runner.os }}-ts-${{ hashFiles('**/tsconfig*.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ts-

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm exec tauri
          tagName: v__VERSION__
          releaseName: UAV Ground Control Station v__VERSION__
          generateReleaseNotes: true
          releaseBody: |
            **UAV Ground Control Station** is a local ground control station for UAVs —
            map, telemetry, and serial link in one dashboard. This stable release ships
            signed desktop installers for Windows and Linux.

            ### Downloads

            | Platform | Artifact | Notes |
            |----------|----------|-------|
            | Windows | `.msi` (WiX) | Recommended installer for most Windows users |
            | Windows | `.exe` (NSIS setup) | Alternative setup installer |
            | Linux | `.AppImage` | Portable, no installation required — `chmod +x` and run |
            | Linux | `.deb` | For Debian/Ubuntu-based distributions |

            ### Installation

            - **Windows:** download the `.msi`, run it, and follow the installer. Windows
              SmartScreen may warn about an unrecognized publisher — choose **More info →
              Run anyway** if you trust this source.
            - **Linux (.AppImage):** `chmod +x UAV-Ground-Control-Station_*.AppImage` then
              run it directly. No system installation is required.
            - **Linux (.deb):** `sudo apt install ./uav-ground-control-station_*.deb`.

            ### Which artifact should I choose?

            - On **Windows**, prefer the **`.msi`** installer; use the `.exe` setup only if
              the MSI does not work in your environment.
            - On **Linux**, prefer the **`.AppImage`** for a portable, distro-agnostic
              option, or the **`.deb`** if you want a managed system package on
              Debian/Ubuntu.

            After installing, launch **UAV Ground Control Station**, then connect your
            serial link (e.g. TX16S at 420000 baud, CRSF-first) from the dashboard.

            ### Support & troubleshooting

            If a link shows "Serial linked" but no telemetry appears, it is usually the
            wrong baud rate or runtime — see the
            [Operator notes](https://github.com/${{ github.repository }}#operator-notes)
            in the README. Found a bug? Please
            [open an issue](https://github.com/${{ github.repository }}/issues).
          releaseDraft: false
          prerelease: false
